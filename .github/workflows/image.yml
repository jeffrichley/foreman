name: image

# Auto-rebuild the foreman:dev container image and publish it to GHCR
# on every push to main. Watchtower on the host polls the :dev tag and
# recreates the running daemon container when a new digest lands; see
# docs/RUNBOOK.md "Image lifecycle (auto-rebuild)" for the full loop.
# Separate from ci.yml because (a) the trigger set differs (push:main
# only, not PRs), (b) the permission set differs (packages: write), and
# (c) a flaky registry must not gate PR mergeability — the precedent
# is release.yml. Tracks foreman#363.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute short SHA
        id: short-sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            IMAGE_SHA=${{ steps.short-sha.outputs.short_sha }}
            ALLOW_DIRTY=false
          tags: |
            ghcr.io/jeffrichley/foreman:dev
            ghcr.io/jeffrichley/foreman:sha-${{ steps.short-sha.outputs.short_sha }}
          cache-from: type=gha,scope=foreman-dev
          cache-to: type=gha,scope=foreman-dev,mode=max
