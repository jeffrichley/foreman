name: image

# Auto-rebuild the foreman:dev container image and publish it to GHCR
# on every push to main. Watchtower on the host polls the :dev tag and
# recreates the running daemon container when a new digest lands; see
# docs/RUNBOOK.md "Image lifecycle (auto-rebuild)" for the full loop.
# Separate from ci.yml because (a) the trigger set differs (push:main
# only, not PRs), (b) the permission set differs (packages: write), and
# (c) a flaky registry must not gate PR mergeability — the precedent
# is release.yml. Tracks foreman#363.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute short SHA
        id: short-sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa16ece964efeb  # v3.3.0

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85  # v6.7.0
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            IMAGE_SHA=${{ steps.short-sha.outputs.short_sha }}
            ALLOW_DIRTY=false
          tags: |
            ghcr.io/jeffrichley/foreman:dev
            ghcr.io/jeffrichley/foreman:sha-${{ steps.short-sha.outputs.short_sha }}
          cache-from: type=gha,scope=foreman-dev
          cache-to: type=gha,scope=foreman-dev,mode=max
