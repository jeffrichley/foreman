name: ci

# Triggers: PRs (with concurrency cancellation), merge groups, pushes to main.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Windows runner removed permanently 2026-06-05 per the Docker
        # runtime design (`docs/superpowers/specs/2026-06-05-foreman-docker-runtime-design.md`).
        # The daemon now runs in a Linux container under WSL2; Windows
        # is no longer a target environment for the daemon path.
        # foreman#98 + foreman#99 closed by that design.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4
      - run: uv sync --locked --all-packages
      - run: just check
      - run: uv cache prune --ci

  dco:
    # DCO sign-off check — non-blocking observation mode. Every commit in
    # the PR must have a ``Signed-off-by:`` trailer for the human who takes
    # responsibility for the change. AI agents can't certify provenance
    # (see CONTRIBUTING.md AI disclosure section). Initially deployed
    # without being added to branch protection's required checks; we're
    # measuring foreman-bot PR behavior before flipping to enforce.
    name: DCO check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by on every commit
        run: |
          set -eu
          BASE_REF="origin/${{ github.base_ref }}"
          MISSING=0
          # --no-merges excludes GitHub's synthetic PR merge commit (and
          # any real merge commits) — DCO is about authorial provenance,
          # which merge commits don't establish.
          for commit in $(git log --no-merges --format=%H "${BASE_REF}..HEAD"); do
            if ! git log -1 --format=%B "${commit}" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              SUBJECT=$(git log -1 --format=%s "${commit}")
              echo "::error::Commit ${commit} (${SUBJECT}) is missing 'Signed-off-by:' trailer. Use 'git commit -s' or amend with 'git commit --amend -s'."
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "${MISSING}" -gt 0 ]; then
            echo "::error::${MISSING} commit(s) missing DCO sign-off. See CONTRIBUTING.md."
            exit 1
          fi
          echo "All commits carry Signed-off-by trailer."
