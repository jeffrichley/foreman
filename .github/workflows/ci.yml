name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Windows runner removed permanently 2026-06-05 per the Docker
        # runtime design (`docs/superpowers/specs/2026-06-05-foreman-docker-runtime-design.md`).
        # The daemon now runs in a Linux container under WSL2; Windows
        # is no longer a target environment for the daemon path.
        # foreman#98 + foreman#99 closed by that design.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4
      - run: uv sync --locked --all-packages
      - run: just check
      # Upload coverage to Codecov (account-wide GitHub App, tokenless).
      # Never reddens CI: fail_ci_if_error is false. coverage.xml is produced
      # by `just check` (pytest-cov, configured in pyproject addopts).
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
      # foreman#336: patch-coverage gate. ``just check`` writes
      # coverage.xml via pytest-cov (configured in pyproject.toml's
      # addopts). diff-cover compares the diff against the PR's base
      # branch and fails if patch coverage falls below 80%. Gated on
      # pull_request events only — push/merge_group events don't have
      # a base ref to diff against.
      - name: Patch coverage gate (diff-cover)
        if: github.event_name == 'pull_request'
        run: uv run --no-sync diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=80
      - run: uv cache prune --ci

  # foreman#555 — NOTE on the sandbox hermetic tests
  # (packages/foreman/tests/v4/test_sandbox_integration.py):
  # These need real bwrap + *unprivileged user namespaces*. Verified
  # 2026-07-19 that GitHub-hosted runners disable unprivileged userns
  # fleet-wide — bwrap's minimal userns probe FAILs on ubuntu-24.04 AND
  # ubuntu-22.04, on the bare runner, and inside docker (default AND
  # --privileged), even with kernel.apparmor_restrict_unprivileged_userns=0
  # and kernel.unprivileged_userns_clone=1 set. So there is no hosted-runner
  # configuration where they can run; they self-skipped in CI.
  # UPDATE (foreman#619): by 2026-10 the hosted ubuntu-latest image boots
  # bwrap's userns probe, so these tests now RUN in `check`. They must not
  # depend on the runner's home layout (the job runs as `runner`, and
  # /root is unreadable to it) — the tests build launchers with no
  # /root/.claude binds for that reason.

  # foreman#464 postmortem: a Dockerfile change (pinning bookworm-pgdg on a
  # base that had silently moved to trixie) merged green because the `check`
  # job runs `just check`, not `docker build` — the image only builds in
  # image.yml on push:main, AFTER merge. So the break surfaced post-merge as
  # a red image build, and Watchtower silently stopped getting new images.
  # This job closes that gap: build the image on PRs so a broken Dockerfile
  # can't merge. It is a SIBLING of `check` (no `needs:`) so the two run
  # concurrently on separate runners — it does not serialize the gate.
  # Build-only (push: false): no registry creds, no packages: write, never
  # touches the :dev tag. Reads (but does not write) the warm gha cache that
  # image.yml populates on main, so a PR build stays ~2-3 min. Skips push:main
  # because image.yml does the real build+push there.
  image-build:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          build-args: |
            IMAGE_SHA=pr-${{ github.event.pull_request.head.sha }}
            ALLOW_DIRTY=false
          cache-from: type=gha,scope=foreman-dev
