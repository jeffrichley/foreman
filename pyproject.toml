# Root pyproject — foreman workspace (uv).
# Member packages live under packages/*. Each owns its [project] metadata.
# This file holds: workspace declaration, dev deps, shared ruff/pytest config.

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
foreman = { workspace = true }

[dependency-groups]
# Dev tools only; real package deps live in member pyprojects.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.14",
    "mypy>=1.11",
    # Type stubs for PyYAML (used in foreman.v4.cli.formatters).
    "types-PyYAML>=6,<7",
    # gitleaks pre-commit hook driver (.pre-commit-config.yaml). See RUNBOOK.
    "pre-commit>=4.0",
    # Dead-code finder. Run via ``uv run vulture packages/foreman/src``.
    # Decision 3 of the 2026-06-11 architecture stability plan. The
    # ``[tool.vulture]`` block below pins the threshold + allowlist for
    # signal-handler / duck-typing false positives.
    "vulture>=2.13",
    # Import boundary linter. Decision 7 of the 2026-06-11 architecture
    # stability plan (originally landed in #311; reinstated here as part
    # of foreman#318 with R2 added to lock the v3/v4 boundary so the
    # cross-cutting modules promoted to survival can't silently re-acquire
    # v3-substrate deps. See [tool.importlinter] below.
    "import-linter>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "packages/foreman/src",
]
extend-exclude = [
    ".venv",
    ".tmp",
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "I",
    "UP",
    "B",
    "RUF100",
    # TODO discipline: a TODO must reference a tracking issue (digit
    # in the body satisfies TD003). Bare # TODO: comments rot — they
    # accumulate without context and nobody knows whether they're
    # still relevant. If a thing is worth marking, it's worth a ticket.
    "TD003",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
files = [
    "packages/foreman/src",
]
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

# Optional-dep override pattern (madrigal-style). Uncomment + edit if your
# package lazy-imports heavy/optional deps so the rest of the module stays
# importable without them installed:
#
# [[tool.mypy.overrides]]
# module = [
#     "torch",
#     "torch.*",
#     "some_optional_lib",
# ]
# ignore_missing_imports = true

[tool.vulture]
# Decision 3 (2026-06-11 architecture stability plan): vulture finds
# dead code (unused functions, classes, methods, variables, imports).
# Run via: ``uv run vulture packages/foreman/src``
#
# Threshold + scope:
#   - ``min_confidence = 80`` catches structurally-dead code without
#     false-positives from dynamic attribute access patterns Python
#     can't introspect statically. At 60-70 the noise floor swamps
#     real findings; at 90+ we miss subtle cases (the unused
#     ``combined_output`` parameter in foreman#299 was 100%).
#   - Tests aren't scanned. Pytest fixtures + parametrize patterns
#     reference test functions via discovery, not import — vulture
#     would flag them all as dead. Test directories are excluded.
#
# Allowlist conventions (``ignore_names``):
#   - Signal-handler params (``signum``, ``frame``) are required by
#     ``signal.signal()``'s callback signature. The Python convention
#     is to name them ``_signum``, ``_frame`` to mark intentional
#     non-use, but the API contract still binds the position.
#   - ``**kwargs`` on NullRunner-style duck-typed stub methods exists
#     so the stubs match the real runner signatures; vulture sees
#     ``kwargs`` itself as unused even though removing it would break
#     callers. Same for class-attribute classifications consumed via
#     ``Outcome.<MEMBER>.classification`` (StrEnum + custom ``__new__``
#     pattern — see ``foreman.reconciler.outcomes`` for the canonical
#     example).
min_confidence = 80
paths = ["packages/foreman/src"]
exclude = [
    "packages/foreman/tests",
    "**/__pycache__",
    ".venv",
    ".tmp",
]
ignore_names = [
    # Signal-handler API conventions
    "signum",
    "frame",
    # Duck-typed stub method **kwargs
    "kwargs",
    # StrEnum classification attribute populated by ``__new__`` and
    # consumed by derived frozenset comprehensions; vulture can't see
    # the comprehension side
    "classification",
]
ignore_decorators = [
    # Click/typer command callbacks are referenced by the framework
    # via decorator registration, not by direct import
    "@cli.command",
    "@daemon.command",
    "@*.command",
]

[tool.importlinter]
# Decision 7 of the 2026-06-11 architecture stability plan. Rule-source
# discipline: every contract names the historical bug or design call
# that motivated it. No speculative rules.
#
# Run locally: ``just import-lint`` (or ``uv run lint-imports``).
# Wired into ``just check`` so it gates pre-push.
root_packages = ["foreman", "tests"]

# R1: production code does not import from tests
# -----------------------------------------------------------------------
# Originally landed in #311 motivated by foreman#19 (a test-fixture
# pollution bug where a pytest fixture's import chain leaked into prod
# code paths). Keeps the build directional: tests can import prod, prod
# can never import tests.
[[tool.importlinter.contracts]]
name = "R1: production code does not import from tests"
type = "forbidden"
source_modules = ["foreman"]
forbidden_modules = ["tests"]

# R2: v4 substrate does not import from v3-substrate modules
# -----------------------------------------------------------------------
# Locks the boundary established by the foreman v4 substrate redesign.
# Phase 9 deletes these modules entirely; until then they coexist and
# foreman.v4.* must never reach into them. Once main is on v4 the rule
# becomes trivially-satisfied but stays in place: it prevents any future
# resurrection from putting foreman.v4 back on a path that depends on the
# old substrate's reconciler / pre-state-machine plumbing.
#
# branches.py, stats.py, labels.py are intentionally NOT in this list —
# they were promoted to survival per foreman#318 because they're
# cross-cutting infra with no v3-substrate deps. dispatch_recorder is
# listed because it IS v3 telemetry plumbing (it pulls reconciler.exec_log).
[[tool.importlinter.contracts]]
name = "R2: foreman.v4 does not import v3-substrate modules"
type = "forbidden"
source_modules = ["foreman.v4"]
forbidden_modules = [
    "foreman.reconciler",
    "foreman.daemon",
    "foreman.daemon_host",
    "foreman.daemon_lock",
    "foreman.daemon_runners",
    "foreman.dispatcher",
    "foreman.dispatch_recorder",
    "foreman.poller",
    "foreman.queue",
    "foreman.role_dispatch",
    "foreman.storage",
    "foreman.worker",
    "foreman.ps",
    "foreman.v3_bus_endpoint",
]

[tool.pytest.ini_options]
testpaths = [
    "packages/foreman/tests",
]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

# Custom marker pattern (madrigal-style). Uncomment + edit when you have
# tests that require expensive external resources (GPU, real cloud API,
# real engine) and should be opt-in:
#
# markers = [
#     "real_engine: requires real engine + heavy deps. Skipped without FOREMAN_REAL_ENGINE_OK=1.",
# ]
