# Root pyproject — foreman workspace (uv).
# Member packages live under packages/*. Each owns its [project] metadata.
# This file holds: workspace declaration, dev deps, shared ruff/pytest config.

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
foreman = { workspace = true }

[dependency-groups]
# Dev tools only; real package deps live in member pyprojects.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.14",
    # Import-graph boundary enforcement. Decision 7 of the 2026-06-11 architecture stability plan.
    "import-linter>=2.0",
    "mypy>=1.11",
    # Type stubs for PyYAML (used in foreman.v4.cli.formatters).
    "types-PyYAML>=6,<7",
    # gitleaks pre-commit hook driver (.pre-commit-config.yaml). See RUNBOOK.
    "pre-commit>=4.0",
    # Dead-code finder. Run via ``uv run vulture packages/foreman/src``.
    # Decision 3 of the 2026-06-11 architecture stability plan. The
    # ``[tool.vulture]`` block below pins the threshold + allowlist for
    # signal-handler / duck-typing false positives.
    "vulture>=2.13",
    # Import boundary linter. Decision 7 of the 2026-06-11 architecture
    # stability plan (originally landed in #311; reinstated here as part
    # of foreman#318 with R2 added to lock the v3/v4 boundary so the
    # cross-cutting modules promoted to survival can't silently re-acquire
    # v3-substrate deps. See [tool.importlinter] below.
    "import-linter>=2.0",
    # foreman#336 step 1/7 — pytest-cov for coverage measurement.
    "pytest-cov>=5.0",
    "diff-cover>=9.0",
    # foreman#336 step 2/7 — pytest-clarity for better assertion-failure diffs.
    "pytest-clarity>=1.0",
    # foreman#336 step 3/7 — pytest-timeout enforces a 60s wallclock cap
    # per test. ``timeout_method = "thread"`` (set below) is required for
    # compatibility with pytest-xdist's worker processes.
    "pytest-timeout>=2.3",
    # foreman#336 step 4/7 — hypothesis for property-based testing.
    # Usage guidance lives in ``.claude/rules/testing.md`` (path-scoped
    # to tests/) so the rule loads only when working on test files.
    "hypothesis>=6.100",
    # foreman#336 step 5/7 — pytest-xdist for parallel test execution.
    # ``--dist=loadscope`` (set below) keeps tests within the same
    # module/class on a single worker so module-scoped fixtures share
    # one instance per worker rather than getting duplicated.
    "pytest-xdist>=3.6",
    # foreman#336 step 6/7 — pytest-randomly shuffles test order each
    # run. Catches inter-test ordering bugs (fixture pollution, shared
    # module state) that fixed-order suites silently mask.
    "pytest-randomly>=3.15",
    # foreman#336 step 7/7 — diff-cover gates patch coverage at 80% on
    # PRs (consumed by .github/workflows/ci.yml; not invoked locally).
    "diff-cover>=9.0",
    "testcontainers[postgres]>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "packages/foreman/src",
]
extend-exclude = [
    ".venv",
    ".tmp",
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "I",
    "UP",
    "B",
    "RUF100",
    # TODO discipline: a TODO must reference a tracking issue (digit
    # in the body satisfies TD003). Bare # TODO: comments rot — they
    # accumulate without context and nobody knows whether they're
    # still relevant. If a thing is worth marking, it's worth a ticket.
    "TD003",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "packages/foreman/src",
]

# Optional-dep override pattern (madrigal-style). Uncomment + edit if your
# package lazy-imports heavy/optional deps so the rest of the module stays
# importable without them installed:
#
# [[tool.mypy.overrides]]
# module = [
#     "torch",
#     "torch.*",
#     "some_optional_lib",
# ]
# ignore_missing_imports = true

[tool.vulture]
# Decision 3 (2026-06-11 architecture stability plan): vulture finds
# dead code (unused functions, classes, methods, variables, imports).
# Run via: ``uv run vulture packages/foreman/src``
#
# Threshold + scope:
#   - ``min_confidence = 80`` catches structurally-dead code without
#     false-positives from dynamic attribute access patterns Python
#     can't introspect statically. At 60-70 the noise floor swamps
#     real findings; at 90+ we miss subtle cases (the unused
#     ``combined_output`` parameter in foreman#299 was 100%).
#   - Tests aren't scanned. Pytest fixtures + parametrize patterns
#     reference test functions via discovery, not import — vulture
#     would flag them all as dead. Test directories are excluded.
#
# Allowlist conventions (``ignore_names``):
#   - Signal-handler params (``signum``, ``frame``) are required by
#     ``signal.signal()``'s callback signature. The Python convention
#     is to name them ``_signum``, ``_frame`` to mark intentional
#     non-use, but the API contract still binds the position.
#   - ``**kwargs`` on NullRunner-style duck-typed stub methods exists
#     so the stubs match the real runner signatures; vulture sees
#     ``kwargs`` itself as unused even though removing it would break
#     callers. Same for class-attribute classifications consumed via
#     ``Outcome.<MEMBER>.classification`` (StrEnum + custom ``__new__``
#     pattern — see ``foreman.reconciler.outcomes`` for the canonical
#     example).
min_confidence = 80
paths = ["packages/foreman/src"]
exclude = [
    "packages/foreman/tests",
    "**/__pycache__",
    ".venv",
    ".tmp",
]
ignore_names = [
    # Signal-handler API conventions
    "signum",
    "frame",
    # Duck-typed stub method **kwargs
    "kwargs",
]
ignore_decorators = [
    # Click/typer command callbacks are referenced by the framework
    # via decorator registration, not by direct import
    "@cli.command",
    "@daemon.command",
    "@*.command",
]

[tool.importlinter]
# Decision 7 of the 2026-06-11 architecture stability plan. Rule-source
# discipline: every contract names the historical bug or design call
# that motivated it. No speculative rules.
#
# Run locally: ``just import-lint`` (or ``uv run lint-imports``).
# Wired into ``just check`` so it gates pre-push.
#
# Both ``foreman`` and ``tests`` must be root_packages so grimp's import
# graph visits both. Without ``tests`` as a root, a stray ``from tests
# import X`` inside ``foreman.*`` would not be visible to the contract
# walker and the R1 rule below would silently no-op.
root_packages = ["foreman", "tests"]
include_external_packages = false

# R1: production code does not import from tests
# -----------------------------------------------------------------------
# Originally landed in #311 motivated by foreman#19 (a test-fixture
# pollution bug where a pytest fixture's import chain leaked into prod
# code paths). Keeps the build directional: tests can import prod, prod
# can never import tests.
[[tool.importlinter.contracts]]
name = "R1: production code does not import from tests"
type = "forbidden"
source_modules = ["foreman"]
forbidden_modules = ["tests"]

# R2: v4 substrate does not import from the (deleted) v3-substrate modules
# -----------------------------------------------------------------------
# The v3 substrate — the reconciler + pre-state-machine daemon plumbing —
# was deleted in the v4 cutover (Phase 9). These modules no longer exist
# in the tree. The rule stays as a permanent ANTI-RESURRECTION guard: if
# any of these names is ever re-created, foreman.v4.* must not import it.
# Listing a now-absent module is intentional — a forbidden contract over a
# missing module is trivially satisfied today and only bites if the module
# comes back. dispatch_recorder is here because it WAS v3 telemetry
# plumbing (it pulled reconciler.exec_log).
#
# Not in this list, by design: the SURVIVAL SET — roles/, auth, git_host,
# git_hosts/, worktree, branches, stats, labels, init, provider(s),
# schemas/, prompts/, instructions, auto_close, _env_filter. This is
# permanent, live production code: the role-execution layer that
# foreman.v4.* (the orchestration substrate) dispatches into. It lives at
# top-level foreman.* by design, NOT as residue awaiting deletion.
# branches/stats/labels were explicitly promoted to survival per
# foreman#318 (cross-cutting infra with no v3-substrate deps).
[[tool.importlinter.contracts]]
name = "R2: foreman.v4 does not import v3-substrate modules"
type = "forbidden"
source_modules = ["foreman.v4"]
forbidden_modules = [
    "foreman.reconciler",
    "foreman.daemon",
    "foreman.daemon_host",
    "foreman.daemon_lock",
    "foreman.daemon_runners",
    "foreman.dispatcher",
    "foreman.dispatch_recorder",
    "foreman.poller",
    "foreman.queue",
    "foreman.role_dispatch",
    "foreman.storage",
    "foreman.worker",
    "foreman.ps",
    "foreman.v3_bus_endpoint",
]

[tool.pytest.ini_options]
testpaths = [
    "packages/foreman/tests",
]
asyncio_mode = "auto"
# foreman#336: 60s per-test cap stops a hung test from burning the
# runner. ``thread`` method works with pytest-xdist worker processes;
# ``signal`` (the default) does not.
timeout = 60
timeout_method = "thread"
addopts = "--import-mode=importlib --cov=packages/foreman/src --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=85 -n auto --dist=loadscope"

# Custom marker pattern (madrigal-style). Uncomment + edit when you have
# tests that require expensive external resources (GPU, real cloud API,
# real engine) and should be opt-in:
#
# markers = [
#     "real_engine: requires real engine + heavy deps. Skipped without FOREMAN_REAL_ENGINE_OK=1.",
# ]

