# Foreman daemon container orchestration.
# Per the Docker design spec; see docs/superpowers/specs/2026-06-05-foreman-docker-runtime-design.md
# v5 addition: postgres sidecar; see docs/superpowers/specs/2026-06-21-foreman-v5-postgres-http-design.md
#
# Lifecycle:
#   docker compose up -d postgres     # start postgres only (optional first-time bootstrap)
#   docker compose up -d daemon       # start daemon (waits for postgres healthy)
#   docker compose stop daemon        # stop (preserves state)
#   docker compose logs -f daemon     # tail structured JSON-lines
#   docker compose down               # remove containers (volumes survive)
#   docker compose down -v            # DESTRUCTIVE: wipes all state including pg data

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — v5 substrate. Named volume survives `down`; only wiped by
  # `down -v`. Set FOREMAN_PG_PASSWORD in .env (see .env.example).
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: foreman-postgres
    environment:
      POSTGRES_USER: foreman
      POSTGRES_PASSWORD: ${FOREMAN_PG_PASSWORD:?set FOREMAN_PG_PASSWORD in .env}
      POSTGRES_DB: foreman
    volumes:
      - foreman-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foreman -d foreman"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Postgres does not need to be publicly reachable; only the daemon
    # container connects (via the internal Docker network by service name).
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  daemon:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/jeffrichley/foreman:dev
    container_name: foreman-daemon

    # v5: wait for postgres to be healthy before starting the daemon so that
    # the psycopg pool creation at bootstrap doesn't race against pg startup.
    depends_on:
      postgres:
        condition: service_healthy

    # Watchtower-scope label: the foreman-watchtower sidecar below
    # (WATCHTOWER_SCOPE=foreman) only manages containers carrying
    # this label, so it can never touch unrelated dev containers the
    # operator happens to have on the same host. See foreman#363.
    labels:
      com.centurylinklabs.watchtower.scope: foreman

    # PID 1: tini handles zombie reaping + signal forwarding for Python.
    # See Docker design spec, Architecture section, "PID 1 / signal forwarding."
    init: true

    # Restart on container crash + on host reboot. `unless-stopped` (vs.
    # `always`) honors an explicit `docker compose stop daemon` — operator
    # intent wins over the policy. See #359 for the failure modes this
    # closes (Windows update reboot, WSL2 shutdown, unhandled-exception
    # crash). Override locally with `docker compose stop daemon` if you
    # need the daemon down for maintenance.
    restart: unless-stopped

    # Env file (gitignored) holds the GitHub App IDs. Required for
    # production — without it the daemon starts but auth fails at first
    # GraphQL fetch (no FOREMAN_*_APP_ID env vars). Copy `.env.example`
    # to `.env` and fill in the App IDs from your GitHub Apps' settings
    # pages before `docker compose up`.
    env_file:
      - .env

    # Compose secrets — 5 GitHub App pem keys.
    # tmpfs-mounted at /run/secrets/<name>, read-only, never persisted in image.
    #
    # Anthropic auth is intentionally NOT a Compose secret. The container's
    # claude CLI authenticates via the CLAUDE_CODE_OAUTH_TOKEN env var
    # (below); a CLAUDE_CONFIG_DIR override points its private state at a
    # path the host's claude session can't touch. This replaces the prior
    # `claude_credentials` Compose-secret shape that created a shared-file
    # race between the host's interactive claude session and the
    # container's role subprocesses (see foreman#392).
    secrets:
      - planner_pem
      - reviewer_pem
      - fixer_pem
      - worker_pem
      - orchestrator_pem

    # Anthropic Max auth — long-lived OAuth token generated via
    # `docker run --rm -it foreman:dev claude setup-token`. Lives ~1 year;
    # rotate annually. CLAUDE_CONFIG_DIR isolates the container's claude
    # state directory so any refresh writes stay inside the container and
    # never touch the host's ~/.claude/. See README for setup steps.
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${FOREMAN_CLAUDE_OAUTH_TOKEN}
      CLAUDE_CONFIG_DIR: /root/.claude-container
      # v5 storage selection. This compose stack ships a postgres sidecar the
      # daemon depends_on, so it runs on postgres by default. The entrypoint
      # renders the [storage] block from these two vars via envsubst (engine
      # defaults to sqlite when unset — set explicitly here to select postgres).
      # "postgres" hostname resolves via Docker's internal DNS to the sibling
      # postgres service above. See docs/runbooks/postgres-migration.md.
      FOREMAN_STORAGE_ENGINE: postgres
      FOREMAN_PG_DSN: postgresql://foreman:${FOREMAN_PG_PASSWORD}@postgres:5432/foreman

    # Persistent state volumes. NOT visible from the Windows host — inspect
    # via `docker exec foreman-daemon ls /foreman/...` or `docker cp`.
    volumes:
      - foreman-repos:/foreman/repos
      - foreman-state:/foreman/state
      - foreman-logs:/foreman/logs
      # foreman#360: backups land on a host BIND MOUNT (not a named
      # volume) so they survive `docker compose down -v`. The whole
      # point of this directory is to protect against the failure
      # mode that `down -v` causes; putting backups on the same
      # named volume they're protecting defeats the purpose.
      - ${HOME}/.foreman/backups:/foreman/backups
      # v5: bind-mount ~/.foreman so the daemon can read v5/config.toml
      # (V5Config) from the host, and so operator key files remain
      # accessible at the same paths the secrets block references.
      # Container path: /root/.foreman (daemon user is root in the image).
      # Windows note: ${HOME} resolves in WSL2/Git-Bash Docker contexts but
      # may not expand on native Windows cmd.exe. On Windows, override with
      # an explicit path in a local docker-compose.override.yml, e.g.:
      #   volumes:
      #     - C:/Users/<you>/.foreman:/root/.foreman
      - ${HOME}/.foreman:/root/.foreman

    # Docker json-file driver: rotation at 10MB × 5 files (≈50MB ceiling).
    # Without this it grows forever inside the WSL2 VM.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Watchtower sidecar (foreman#363): poll GHCR for new digests on the
  # `ghcr.io/jeffrichley/foreman:dev` tag and recreate the daemon
  # container when one lands. Scoped via WATCHTOWER_SCOPE to ONLY manage
  # containers carrying the matching `com.centurylinklabs.watchtower.scope`
  # label — blast radius is limited to foreman-daemon, never sibling
  # dev containers on the same host.
  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: foreman-watchtower
    restart: unless-stopped
    environment:
      # Poll GHCR every 2 minutes. The merge → image-published →
      # daemon-pulled wall-clock budget is ~5 min in the acceptance
      # criteria; CI build is ~2-3 min and the next poll lands
      # within 2 min after that. Tighter intervals burn rate-limit
      # quota on GHCR without operational gain.
      WATCHTOWER_POLL_INTERVAL: "120"
      # Remove the previous image layer after a successful update.
      # Without this the WSL2 disk fills with one stale image per
      # merge over time.
      WATCHTOWER_CLEANUP: "true"
      # Only manage containers labeled with this scope. Without a
      # scope, Watchtower would attempt to manage EVERY container
      # on the host (any voice/agent_core dev containers the
      # operator happens to be running).
      WATCHTOWER_SCOPE: "foreman"
      # JSON-lines log output matches the daemon's structured log
      # convention; tail via `docker compose logs -f watchtower`.
      WATCHTOWER_LOG_FORMAT: "Json"
    volumes:
      # Docker socket is required for Watchtower to inspect/pull/
      # recreate containers. This is essentially root-on-host; the
      # scope label above keeps the blast radius limited to
      # foreman-daemon.
      - /var/run/docker.sock:/var/run/docker.sock

# Named volumes (managed by Docker; survive container restarts and `down`).
volumes:
  foreman-repos:
  foreman-state:
  foreman-logs:
  # v5: postgres data volume. Persists across container restarts and `down`.
  # Only destroyed by `docker compose down -v` (explicit operator intent).
  foreman-pg-data:

# Secrets sourced from the host's protected user directory.
secrets:
  planner_pem:
    file: ${HOME}/.foreman/keys/planner.pem
  reviewer_pem:
    file: ${HOME}/.foreman/keys/reviewer.pem
  fixer_pem:
    file: ${HOME}/.foreman/keys/fixer.pem
  worker_pem:
    file: ${HOME}/.foreman/keys/worker.pem
  orchestrator_pem:
    file: ${HOME}/.foreman/keys/orchestrator.pem
