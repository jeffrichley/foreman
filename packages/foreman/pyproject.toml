[project]
# Distribution name (PyPI). Intentionally differs from the import name +
# CLI command, which both stay `foreman` — the bare `foreman` name is taken
# on PyPI (Puppet's Foreman). `agent-core-<tool>` is the family namespace
# for substrate-coupled tools (see foreman#443 release-policy discussion).
# `pip install agent-core-foreman` still gives you `import foreman` + the
# `foreman` CLI.
name = "agent-core-foreman"
dynamic = ["version"]
description = "Multi-identity GitHub-issue-to-PR orchestrator on agent-core substrate."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "PyGithub>=2.0,<3",
    "PyJWT[crypto]>=2.8,<3",
    "claude-agent-sdk>=0.1,<1",
    "pydantic>=2.5,<3",
    "click>=8.1,<9",
    "requests>=2.31,<3",
    "rich>=13,<15",
    "typer>=0.12,<1",
    "pyyaml>=6,<7",
    "psycopg[binary,pool]>=3.2,<4",
]

[project.scripts]
foreman = "foreman.v4.cli:main"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foreman"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]
